// 홈 화면 앱(웹 주소로 열었을 때만): 오프라인 캐시 등록 + 저장 공간 '지우지 마세요' 요청. 안드로이드·아이폰 앱 안에서는 쓰지 않음
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  // 새 판을 받으면: 목록 화면이면 바로 새로 열기, 작업 중이면 목록으로 돌아갈 때 적용 (작업은 이미 자동 저장됨)
  var hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadCtrl) return;
    window.__sjUpdate = true;
    // (열린 창 · 대화 · 악보 모드가 있으면 새로 열지 않음 — 연주 중 튕기거나 쓰던 글자가 사라지지 않게 · 점검원 ⑤ 11-02)
    var busy = document.querySelector('.sheet.on, .dialog.on, .perf:not(.hidden)') || (window.SJ && SJ.Performance && SJ.Performance.isOpen && SJ.Performance.isOpen());
    if (window.SJ && SJ.App && SJ.App.view === 'library' && !busy) location.reload();
    else if (window.SJ && SJ.UI) SJ.UI.toast(SJ.App && SJ.App.view === 'library' ? SJ.t('새 버전을 받았어요 · 열린 화면을 닫으면 적용돼요') : SJ.t('새 버전을 받았어요 · 목록으로 돌아가면 적용돼요'));
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
</script>
